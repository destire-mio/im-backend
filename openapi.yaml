          type: string
          minLength: 1
          maxLength: 32
          description: Normalized to lowercase and trimmed before server validation
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 128
        deviceId:
          type: string
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - loginRequestId
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
          description: Normalized to lowercase and trimmed before credential lookup
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
        loginRequestId:
          type: string
          minLength: 16
          maxLength: 128
        deviceId:
          type: string
          maxLength: 128
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
        - idempotencyKey
      properties:
        refreshToken:
          type: string
          minLength: 1
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - sessionId
        - deviceId
        - sessionExpiresAt
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        user:
          $ref: '#/components/schemas/User'
        sessionId:
          type: integer
          format: int64
          minimum: 1
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
        sessionExpiresAt:
          type: string
          format: date-time
        accessToken:
          type: string
          minLength: 1
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          minLength: 1
        refreshTokenExpiresAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
