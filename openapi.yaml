openapi: 3.0.3
info:
  title: IM Backend API
  version: 0.1.0
paths:
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a user and create the first device session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User and first device session created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Malformed JSON or invalid registration data
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterBadRequest'
        '409':
          description: Username is already registered
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterConflict'
        '429':
          description: Registration rate limit exceeded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Retry-After:
              description: Whole seconds until another attempt is allowed
              required: true
              schema:
                type: string
                pattern: '^[1-9][0-9]*$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRateLimited'
        '500':
          description: Unexpected registration failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Authentication rate limiter is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRateLimitUnavailable'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate and idempotently create or recover a device session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session created or recovered
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Malformed JSON or invalid login request metadata
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginBadRequest'
        '401':
          description: Username or password is invalid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentials'
        '409':
          description: loginRequestId belongs to another login
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginConflict'
        '429':
          description: Login rate limit exceeded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Retry-After:
              description: Whole seconds until another attempt is allowed
              required: true
              schema:
                type: string
                pattern: '^[1-9][0-9]*$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRateLimited'
        '500':
          description: Unexpected login failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Login recovery or authentication rate limiter is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUnavailable'
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token or recover the same rotation result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session tokens rotated or idempotently recovered
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Malformed JSON or invalid idempotency key
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshBadRequest'
        '401':
          description: Refresh token is invalid, expired, revoked, or replayed with a different key
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenInvalid'
        '429':
          description: Refresh rate limit exceeded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Retry-After:
              description: Whole seconds until another attempt is allowed
              required: true
              schema:
                type: string
                pattern: '^[1-9][0-9]*$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRateLimited'
        '503':
          description: Refresh recovery or authentication rate limiter is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshUnavailable'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current device session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '500':
          description: Unexpected logout failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke all sessions for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '500':
          description: Unexpected logout failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List all device sessions for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device sessions, including revoked sessions
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '500':
          description: Unexpected session listing failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /auth/sessions/{sessionID}:
    delete:
      operationId: revokeSession
      summary: Revoke one active device session owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Session revoked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          description: sessionID is not a positive integer
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidSessionID'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '404':
          description: Active owned session was not found
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNotFound'
        '500':
          description: Unexpected session revocation failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password and revoke all device sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed and all sessions revoked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          description: Malformed JSON or invalid new password
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordBadRequest'
        '401':
          description: Access token or current password is invalid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordUnauthorized'
        '409':
          description: Password changed concurrently
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeConflict'
        '500':
          description: Unexpected password change failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /messages:
    post:
      operationId: createMessage
      summary: Create or idempotently replay a direct message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: Existing message returned for an idempotent replay
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '201':
          description: Message created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Malformed JSON, invalid message data, or unknown receiver
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageBadRequest'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '409':
          description: The idempotency key was reused with different message data
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageConflict'
        '503':
          description: The message service dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageUnavailable'
        '500':
          description: Unexpected message creation failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageInternalError'
    get:
      operationId: listDirectMessageHistory
      summary: Page through direct-message history with one peer
      security:
        - bearerAuth: []
      parameters:
        - name: peerId
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: before
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: after
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Chronologically ordered message-history page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistoryPage'
        '400':
          description: Invalid peer, query shape, limit, or cursor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistoryBadRequest'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '500':
          description: Unexpected message-history failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /conversations:
    get:
      operationId: listConversations
      summary: List a stable snapshot of the authenticated user's conversations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SnapshotCursor'
      responses:
        '200':
          description: Conversation snapshot page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          description: Invalid pagination parameters
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidPagination'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '409':
          description: A cursor is ahead of the current conversation list
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorAhead'
        '500':
          description: Unexpected conversation listing failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageInternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /conversations/{conversationID}/messages:
    get:
      operationId: syncConversationMessages
      summary: Read a stable page from one conversation stream
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SnapshotCursor'
      responses:
        '200':
          description: Conversation message page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagePage'
        '400':
          description: Invalid conversation identifier or pagination parameters
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSyncBadRequest'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '404':
          description: Conversation is not visible to the authenticated user
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationNotFound'
        '409':
          description: A cursor is ahead of the current conversation stream
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorAhead'
        '500':
          description: Unexpected conversation synchronization failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageInternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /conversations/{conversationID}/ack:
    post:
      operationId: acknowledgeConversation
      summary: Advance one device's durable cursor for a conversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeConversationRequest'
      responses:
        '200':
          description: Current durable device cursor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConversationSyncState'
        '400':
          description: Invalid conversation identifier, JSON, or cursor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationAckBadRequest'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '404':
          description: Conversation is not visible to the authenticated user
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationNotFound'
        '409':
          description: Cursor is ahead of the current conversation stream
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorAhead'
        '500':
          description: Unexpected acknowledgement failure
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageInternalError'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /messages/sync:
    get:
      deprecated: true
      operationId: deprecatedUserMessageSync
      summary: Deprecated user-level message Sync endpoint
      security:
        - bearerAuth: []
      responses:
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '410':
          description: Use conversation-scoped recovery endpoints
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointGone'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /messages/ack:
    post:
      deprecated: true
      operationId: deprecatedUserMessageAck
      summary: Deprecated user-level message acknowledgement endpoint
      security:
        - bearerAuth: []
      responses:
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '410':
          description: Use conversation-scoped acknowledgement
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointGone'
        '503':
          description: Authentication dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUnavailable'
  /health:
    get:
      operationId: health
      summary: Check whether the application can query PostgreSQL
      responses:
        '200':
          description: Application database dependency is ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: PostgreSQL is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyUnavailable'
  /ws:
    get:
      operationId: connectWebSocket
      summary: Upgrade an authenticated HTTP connection to the realtime WebSocket
      security:
        - bearerAuth: []
      responses:
        '101':
          description: WebSocket protocol selected
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '401':
          description: A valid access token is required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequired'
        '426':
          description: Valid WebSocket upgrade headers are required
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '503':
          description: Authentication or realtime dependency is temporarily unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
  headers:
    RequestID:
      description: Server-generated identifier used to correlate the response with logs
      required: true
      schema:
        type: string
        minLength: 1
    PrivateNoStore:
      description: Prevent storage of token-bearing authentication responses
      required: true
      schema:
        type: string
        enum:
          - no-store
  parameters:
    ConversationID:
      name: conversationID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    After:
      name: after
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    SnapshotCursor:
